apiVersion: batch/v1
kind: CronJob
metadata:
  name: portal-monitor
  namespace: portal-monitor

spec:
  schedule: "*/10 * * * *"

  concurrencyPolicy: Forbid

  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 480

      template:
        metadata:
          labels:
            app: portal-monitor

        spec:
          restartPolicy: Never

          containers:
            - name: portal-monitor

              # Replaced by CD: sed IMAGE_PLACEHOLDER
              image: IMAGE_PLACEHOLDER

              imagePullPolicy: IfNotPresent

              env:
                - name: DOMAINS_FILE
                  value: /app/domains.txt

                - name: STATE_FILE
                  value: /data/status.json

                - name: PLAYWRIGHT_HEADLESS
                  value: "true"

                - name: IGNORE_HTTPS_ERRORS
                  value: "false"

                - name: WEBHOOK_VERIFY_TLS
                  value: "true"

                - name: ALERT_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: portal-monitor-alert
                      key: webhook-url

              volumeMounts:
                - name: domains
                  mountPath: /app/domains.txt
                  subPath: domains.txt
                  readOnly: true

                - name: state
                  mountPath: /data

              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"

                limits:
                  cpu: "1000m"
                  memory: "1Gi"

          volumes:
            - name: domains
              configMap:
                name: portal-monitor-config

            - name: state
              persistentVolumeClaim:
                claimName: portal-monitor-state