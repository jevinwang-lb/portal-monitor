name: CD - Test

on:
  workflow_run:
    workflows:
      - Build and Push Docker Image
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Test image tag, e.g. sha-96b8ec3"
        required: true

env:
  KUBE_LATEST_VERSION: "v1.36.0"
  NAMESPACE: "portal-monitor"
  IMAGE_NAME: "jevinwanglb/portal-monitor"

jobs:
  deploy-test:
    name: Deploy Test Job
    runs-on: arc-runner-set-portal

    # CI 失败时不要继续部署测试环境
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Install kubectl
      # --------------------------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBE_LATEST_VERSION }}

      # --------------------------------------------------
      # Check Kubernetes access
      # --------------------------------------------------
      - name: Check Kubernetes access
        run: |
          kubectl auth whoami
          kubectl get namespace "$NAMESPACE"

      # --------------------------------------------------
      # Determine image tag
      #
      # Automatic:
      #   use the SHA generated by the CI commit
      #
      # Manual:
      #   use workflow_dispatch input
      # --------------------------------------------------
      - name: Determine image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            TAG="sha-${SHA:0:7}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Test image:"
          echo "${IMAGE_NAME}:$TAG"

      # --------------------------------------------------
      # Deploy test PVC
      # --------------------------------------------------
      - name: Deploy test PVC
        run: |
          kubectl apply \
            -f k8s/test-pvc.yaml \
            -n "$NAMESPACE"

      # --------------------------------------------------
      # Deploy test ConfigMap
      # --------------------------------------------------
      - name: Deploy test ConfigMap
        run: |
          kubectl apply \
            -f k8s/configmap.yaml \
            -n "$NAMESPACE"

      # --------------------------------------------------
      # Deploy / update test Job
      # --------------------------------------------------
      - name: Deploy test Job
        run: |
          IMAGE="${IMAGE_NAME}:${{ steps.image.outputs.tag }}"

          echo "Using image:"
          echo "$IMAGE"

          cat > /tmp/test-job.yaml <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: portal-monitor-test
            namespace: ${NAMESPACE}
          spec:
            backoffLimit: 0

            template:
              metadata:
                labels:
                  app: portal-monitor-test

              spec:
                restartPolicy: Never

                containers:
                  - name: portal-monitor

                    image: ${IMAGE}
                    imagePullPolicy: Always

                    env:
                      - name: DOMAINS_FILE
                        value: /app/domains.txt

                      - name: STATE_FILE
                        value: /data/status.json

                      - name: PLAYWRIGHT_HEADLESS
                        value: "true"

                      - name: IGNORE_HTTPS_ERRORS
                        value: "false"

                      - name: WEBHOOK_VERIFY_TLS
                        value: "true"

                      - name: ALERT_WEBHOOK_URL
                        valueFrom:
                          secretKeyRef:
                            name: portal-monitor-alert
                            key: webhook-url

                    volumeMounts:
                      - name: domains
                        mountPath: /app/domains.txt
                        subPath: domains.txt
                        readOnly: true

                      - name: state
                        mountPath: /data

                    resources:
                      requests:
                        cpu: "100m"
                        memory: "256Mi"

                      limits:
                        cpu: "1000m"
                        memory: "1Gi"

                volumes:
                  - name: domains
                    configMap:
                      name: portal-monitor-config

                  - name: state
                    persistentVolumeClaim:
                      claimName: portal-monitor-state-test
          EOF

          kubectl delete job portal-monitor-test \
            -n "$NAMESPACE" \
            --ignore-not-found

          kubectl apply \
            -f /tmp/test-job.yaml

      # --------------------------------------------------
      # Wait for Job
      # --------------------------------------------------
      - name: Wait for test Job
        run: |
          kubectl wait \
            --namespace "$NAMESPACE" \
            --for=condition=complete \
            --timeout=10m \
            job/portal-monitor-test

      # --------------------------------------------------
      # Show logs
      # --------------------------------------------------
      - name: Show test logs
        if: always()
        run: |
          kubectl logs \
            --namespace "$NAMESPACE" \
            job/portal-monitor-test

      # --------------------------------------------------
      # Show test result
      # --------------------------------------------------
      - name: Show test status
        if: always()
        run: |
          kubectl get job \
            portal-monitor-test \
            -n "$NAMESPACE"

          kubectl get pod \
            -n "$NAMESPACE" \
            -l app=portal-monitor-test