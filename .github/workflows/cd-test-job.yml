name: CD - Test

on:
  workflow_run:
    workflows:
      - Build and Push Docker Image
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Test image tag, e.g. sha-96b8ec3"
        required: true

env:
  KUBE_LATEST_VERSION: "v1.36.0"
  NAMESPACE: "portal-monitor"
  IMAGE_NAME: "jevinwanglb/portal-monitor"

jobs:
  deploy-test:
    name: Deploy Test Job
    runs-on: arc-runner-set-portal

    # CI 失败时不要继续部署测试环境
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # --------------------------------------------------
      # Install kubectl
      # --------------------------------------------------
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBE_LATEST_VERSION }}

      # --------------------------------------------------
      # Check Kubernetes access
      # --------------------------------------------------
      - name: Check Kubernetes access
        run: |
          kubectl auth whoami
          kubectl get namespace "$NAMESPACE"

      # --------------------------------------------------
      # Determine image tag
      #
      # Automatic:
      #   use the SHA generated by the CI commit
      #
      # Manual:
      #   use workflow_dispatch input
      # --------------------------------------------------
      - name: Determine image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            SHA="${{ github.event.workflow_run.head_sha }}"
            TAG="sha-${SHA:0:7}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo "Test image:"
          echo "${IMAGE_NAME}:$TAG"

      # --------------------------------------------------
      # Deploy test PVC
      # --------------------------------------------------
      - name: Deploy test PVC
        run: |
          kubectl apply \
            -f k8s/test-pvc.yaml \
            -n "$NAMESPACE"

      # --------------------------------------------------
      # Deploy test ConfigMap
      # --------------------------------------------------
      - name: Deploy test ConfigMap
        run: |
          kubectl apply \
            -f k8s/test-configmap.yaml \
            -n "$NAMESPACE"

      # --------------------------------------------------
      # Deploy / update test Job
      # Job pod template is immutable, so delete + recreate
      # with the target image injected into the manifest.
      # --------------------------------------------------
      - name: Deploy test Job
        run: |
          IMAGE="${IMAGE_NAME}:${{ steps.image.outputs.tag }}"

          echo "Using image:"
          echo "$IMAGE"

          kubectl delete job portal-monitor-test \
            -n "$NAMESPACE" \
            --ignore-not-found

          # Wait until the old Job is fully gone before recreate
          kubectl wait \
            --namespace "$NAMESPACE" \
            --for=delete \
            --timeout=60s \
            job/portal-monitor-test \
            2>/dev/null || true

          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|" k8s/test-job.yaml \
            | kubectl apply -n "$NAMESPACE" -f -

      # --------------------------------------------------
      # Wait for Job
      # --------------------------------------------------
      - name: Wait for test Job
        run: |
          if ! kubectl wait \
            --namespace "$NAMESPACE" \
            --for=condition=complete \
            --timeout=10m \
            job/portal-monitor-test; then

            FAILED=$(kubectl get job portal-monitor-test \
              -n "$NAMESPACE" \
              -o jsonpath='{.status.failed}')

            echo "Job did not complete successfully (failed=${FAILED:-0})"
            exit 1
          fi

      # --------------------------------------------------
      # Show logs
      # --------------------------------------------------
      - name: Show test logs
        if: always()
        run: |
          kubectl logs \
            --namespace "$NAMESPACE" \
            job/portal-monitor-test

      # --------------------------------------------------
      # Show test result
      # --------------------------------------------------
      - name: Show test status
        if: always()
        run: |
          kubectl get job \
            portal-monitor-test \
            -n "$NAMESPACE"

          kubectl get pod \
            -n "$NAMESPACE" \
            -l app=portal-monitor-test